[workspace]
members = ["packages/*"]

[workspace.package]
version = "0.0.0"               # not inherited: each package sets its own version
edition = "2024_07"
cairo-version = "2.19.0"
license = "MIT"
repository = "https://github.com/bal7hazar/quiver"

[workspace.dependencies]
starknet = "2.19.0"
snforge_std = "0.61.0"

[workspace.tool.fmt]
sort-module-level-items = true
